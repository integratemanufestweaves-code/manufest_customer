<div class="announcement">Free shipping on orders above ₹2,999 &middot; Cash on delivery available</div>

<header class="header">
  <div class="header__row container">
    <button
      type="button"
      class="header__menu-toggle"
      [attr.aria-expanded]="mobileMenuOpen()"
      aria-label="Toggle menu"
      (click)="toggleMobileMenu()"
    >
      <span></span><span></span><span></span>
    </button>

    <a routerLink="/" class="header__logo" (click)="closeMobileMenu()">
      <img class="header__logo-mark" [src]="logoMark" alt="Manufest" />
      <span class="header__logo-word">Manufest</span>
    </a>

    <nav class="header__nav" aria-label="Primary">
      @for (link of navLinks; track link.path) {
        <a [routerLink]="link.path">{{ link.label }}</a>
      }
    </nav>

    <div class="header__search">
      <input type="search" placeholder="Search for sarees, fabrics, weaves..." aria-label="Search" />
      <a routerLink="/search" class="header__search-btn" aria-label="Search">
        <svg viewBox="0 0 20 20" fill="none" width="16" height="16"><path d="M9 17a8 8 0 1 0 0-16 8 8 0 0 0 0 16Zm9 1-4.35-4.35" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      </a>
    </div>

    <div class="header__actions">
      <a routerLink="/search" class="header__icon-btn header__icon-btn--search-mobile" aria-label="Search">
        <svg viewBox="0 0 20 20" fill="none" width="18" height="18"><path d="M9 17a8 8 0 1 0 0-16 8 8 0 0 0 0 16Zm9 1-4.35-4.35" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      </a>
      <a routerLink="/wishlist" class="header__icon-btn">
        <svg viewBox="0 0 24 24" fill="none" width="20" height="20"><path d="M12 20s-7-4.35-9.5-8.5C.6 8 2 4.5 5.5 4a5 5 0 0 1 6.5 2 5 5 0 0 1 6.5-2C22 4.5 23.4 8 21.5 11.5 19 15.65 12 20 12 20Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>
        <span class="header__icon-label">Wishlist</span>
      </a>
      <a routerLink="/cart" class="header__icon-btn">
        <svg viewBox="0 0 24 24" fill="none" width="20" height="20"><path d="M3 4h2l2.4 12.2a2 2 0 0 0 2 1.6h7.4a2 2 0 0 0 2-1.6L21 8H6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="10" cy="21" r="1.2" fill="currentColor"/><circle cx="17" cy="21" r="1.2" fill="currentColor"/></svg>
        <span class="header__icon-label">Cart</span>
      </a>
      <a routerLink="/account" class="header__icon-btn header__icon-btn--account">
        <svg viewBox="0 0 24 24" fill="none" width="20" height="20"><circle cx="12" cy="8" r="3.5" stroke="currentColor" stroke-width="1.5"/><path d="M4.5 20c1.4-3.6 4.4-5.5 7.5-5.5s6.1 1.9 7.5 5.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      </a>
    </div>
  </div>

  @if (mobileMenuOpen()) {
    <nav class="header__mobile-nav" aria-label="Primary">
      @for (link of navLinks; track link.path) {
        <a [routerLink]="link.path" (click)="closeMobileMenu()">{{ link.label }}</a>
      }
    </nav>
  }
</header>
