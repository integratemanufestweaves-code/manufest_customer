<div class="otp-input" role="group" [attr.aria-label]="label()">
  @for (digit of digits(); track $index) {
    <input
      #box
      class="otp-input__box"
      [class.otp-input__box--filled]="digit"
      [class.otp-input__box--invalid]="invalid()"
      type="text"
      inputmode="numeric"
      pattern="[0-9]*"
      maxlength="1"
      spellcheck="false"
      [attr.autocomplete]="$index === 0 ? 'one-time-code' : 'off'"
      [attr.aria-label]="'Digit ' + ($index + 1) + ' of ' + digits().length"
      [attr.aria-invalid]="invalid() || null"
      [value]="digit"
      [disabled]="disabled()"
      (input)="onInput($index, $event)"
      (keydown)="onKeydown($index, $event)"
      (paste)="onPaste($index, $event)"
      (focus)="onFocus($event)"
      (blur)="onBlur($event)"
    />
  }
</div>
