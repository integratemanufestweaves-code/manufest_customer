<div class="card">
  <a class="card__link" [routerLink]="['/product', product.uuid]">
    <div class="card__media">
      @if (thumbnailSrc) {
        @if (product.thumbnail?.mediaType === 'video') {
          <video [src]="thumbnailSrc" muted playsinline></video>
        } @else {
          <img [src]="thumbnailSrc" [alt]="product.productName" loading="lazy" (error)="onThumbnailError()" />
        }
      } @else {
        <div class="card__media-placeholder" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="28" height="28" fill="none"><rect x="3" y="4" width="18" height="16" rx="2" stroke="currentColor" stroke-width="1.4"/><path d="M3 16l5-5 4 4 3-3 6 6" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>
        </div>
      }

      <button type="button" class="card__wishlist" [class.card__wishlist--active]="isWishlisted" (click)="toggleWishlist($event)" [attr.aria-label]="isWishlisted ? 'Remove from wishlist' : 'Add to wishlist'" [attr.aria-pressed]="isWishlisted">
        <svg viewBox="0 0 24 24" [attr.fill]="isWishlisted ? 'currentColor' : 'none'" width="16" height="16"><path d="M12 20s-7-4.35-9.5-8.5C.6 8 2 4.5 5.5 4a5 5 0 0 1 6.5 2 5 5 0 0 1 6.5-2C22 4.5 23.4 8 21.5 11.5 19 15.65 12 20 12 20Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>
      </button>
    </div>

    <div class="card__body">
      <p class="card__name">{{ product.productName }}</p>
      @if (product.seller?.name) {
        <p class="card__seller">by {{ product.seller?.name }}</p>
      }
      @if (priceLabel) {
        <p class="card__price">{{ priceLabel }}</p>
      }
    </div>
  </a>

  <!-- Sibling <button>, not nested inside `.card__link`, so the card stays
       valid markup and the two don't fight over clicks — see this
       component's header comment for why a listing-grid "quick add" needs
       an extra product-detail call to resolve a variant first. -->
  <button type="button" class="card__add" (click)="addToCart($event)" [disabled]="addingToCart()">
    {{ addingToCart() ? 'Adding…' : '+ Add to cart' }}
  </button>
  @if (addToCartError()) {
    <p class="card__add-error">{{ addToCartError() }}</p>
  }
</div>
